<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Studio - Edge TTS Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen bg-[#f5f5f0] text-[#1a1a1a] p-4 sm:p-8 md:p-12">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="mb-10 text-center">
      <div class="inline-flex p-3 bg-[#5A5A40] text-white rounded-full mb-3 shadow-sm">
        <i class="fa-solid fa-volume-high text-2xl"></i>
      </div>
      <h1 class="text-4xl sm:text-5xl font-serif-title font-light mb-2 tracking-tight">
        Audio <span class="italic font-normal">Studio</span>
      </h1>
      <p class="text-[#5A5A40] text-sm opacity-90">
        전용 고성능 Edge TTS 마이크로서비스 (Emma · 선희 · 인준 지원)
      </p>
      <div class="mt-2 inline-flex items-center gap-2 px-3 py-1 bg-green-100 text-green-800 text-xs rounded-full font-medium">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> 서비스 정상 가동 중
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Input Section -->
      <main class="md:col-span-2 space-y-6">
        <div class="bg-white rounded-3xl shadow-sm border border-black/5 p-6 space-y-5">
          <!-- Voice & Mode Selection -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#5A5A40] uppercase tracking-wider mb-2">음성 선택 (Voice)</label>
              <select id="voiceSelect" class="w-full bg-[#f9f9f7] border border-black/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#5A5A40]">
                <option value="en-US-EmmaMultilingualNeural">Emma (영어/다국어 여성, 추천)</option>
                <option value="ko-KR-SunHiNeural">선희 (한국어 여성, 추천)</option>
                <option value="ko-KR-InJoonNeural">인준 (한국어 남성)</option>
                <option value="en-US-GuyNeural">Guy (영어 남성)</option>
                <option value="en-US-JennyNeural">Jenny (영어 여성)</option>
                <option value="en-US-AndrewMultilingualNeural">Andrew (영어 다국어 남성)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#5A5A40] uppercase tracking-wider mb-2">작업 모드 (Mode)</label>
              <select id="modeSelect" class="w-full bg-[#f9f9f7] border border-black/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#5A5A40]">
                <option value="batch">일괄 변환 (구절/줄 단위 분할)</option>
                <option value="single">단일 오디오 생성 (통합 파일)</option>
                <option value="instant">즉시 듣기 (스트리밍)</option>
              </select>
            </div>
          </div>

          <!-- Text Input -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-semibold text-[#5A5A40] uppercase tracking-wider">텍스트 입력</label>
              <span id="charCount" class="text-xs text-gray-400">0자</span>
            </div>
            <textarea id="textInput" rows="9" placeholder="변환할 텍스트를 입력하세요.&#10;성경 구절(예: 1:1 태초에 말씀이...) 또는 일반 텍스트 모두 지원됩니다." class="w-full bg-[#f9f9f7] border border-black/10 rounded-2xl p-4 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-[#5A5A40] resize-y"></textarea>
          </div>

          <!-- Convert Button & Status -->
          <div class="pt-2">
            <button id="convertBtn" class="w-full bg-[#5A5A40] hover:bg-[#4a4a35] text-white py-3.5 rounded-2xl font-medium shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
              <i class="fa-solid fa-play"></i> <span id="btnText">음성 변환 시작</span>
            </button>
            <div id="progressBar" class="hidden mt-3 w-full bg-gray-200 rounded-full h-2 overflow-hidden">
              <div id="progressFill" class="bg-[#5A5A40] h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="statusMsg" class="text-xs text-center text-gray-500 mt-2 min-h-[16px]"></p>
          </div>
        </div>
      </main>

      <!-- Results & Download Panel -->
      <aside class="space-y-6">
        <div class="bg-white rounded-3xl shadow-sm border border-black/5 p-6 h-[calc(100vh-220px)] min-h-[500px] flex flex-col">
          <div class="flex items-center justify-between pb-4 border-b border-black/5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#5A5A40] flex items-center gap-2">
              <i class="fa-solid fa-list-ul"></i> 생성된 오디오 (<span id="resultCount">0</span>)
            </h2>
            <div class="flex items-center gap-1.5">
              <button id="zipDownloadBtn" disabled class="px-2.5 py-1 bg-[#5A5A40] hover:bg-[#4a4a35] text-white text-[11px] font-semibold rounded-full tracking-tight transition-all disabled:opacity-30 cursor-pointer" title="전체 MP3 ZIP 다운로드">
                <i class="fa-solid fa-download"></i> ZIP
              </button>
              <button id="clearAllBtn" disabled class="p-1.5 text-red-400 hover:text-red-600 rounded-full transition-colors disabled:opacity-30 cursor-pointer" title="전체 비우기">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>

          <!-- List -->
          <div id="resultsList" class="flex-1 overflow-y-auto space-y-3 pt-4 pr-1">
            <div id="emptyPlaceholder" class="h-full flex flex-col items-center justify-center text-gray-300 space-y-2">
              <i class="fa-solid fa-file-audio text-4xl stroke-1"></i>
              <p class="text-xs italic">생성된 오디오가 없습니다</p>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const modeSelect = document.getElementById('modeSelect');
    const convertBtn = document.getElementById('convertBtn');
    const btnText = document.getElementById('btnText');
    const charCount = document.getElementById('charCount');
    const statusMsg = document.getElementById('statusMsg');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const resultsList = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');
    const zipDownloadBtn = document.getElementById('zipDownloadBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const emptyPlaceholder = document.getElementById('emptyPlaceholder');

    let audioResults = [];

    // Character counter
    textInput.addEventListener('input', () => {
      charCount.textContent = `${textInput.value.length}자`;
    });

    // Parse verses or lines
    function parseVerses(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const items = [];
      let idx = 1;
      for (const line of lines) {
        if (!/[\p{L}\p{N}]/u.test(line)) continue;
        const match = line.match(/^(\d+:\d+|\d+[\.\)]|\d+)\s*(.*)$/);
        if (match) {
          items.push({ title: match[1].replace(/[\.\)]/, '절'), text: match[2] || line });
        } else {
          const title = line.length > 15 ? line.slice(0, 15) + '...' : line;
          items.push({ title: `${String(idx).padStart(2, '0')}_${title}`, text: line });
        }
        idx++;
      }
      return items;
    }

    async function synthesizeText(text, voice) {
      const res = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || 'TTS 요청 실패');
      }
      return await res.blob();
    }

    function addAudioItem(title, blob, text) {
      const id = Math.random().toString(36).substr(2, 9);
      const url = URL.createObjectURL(blob);
      const item = { id, title, blob, url, text };
      audioResults.unshift(item);
      renderResults();
      return item;
    }

    function renderResults() {
      resultCount.textContent = audioResults.length;
      zipDownloadBtn.disabled = audioResults.length === 0;
      clearAllBtn.disabled = audioResults.length === 0;

      if (audioResults.length === 0) {
        resultsList.innerHTML = '';
        resultsList.appendChild(emptyPlaceholder);
        return;
      }

      resultsList.innerHTML = '';
      audioResults.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'p-3.5 bg-[#f9f9f7] rounded-2xl border border-black/5 space-y-2 transition-all hover:border-black/15';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-[#5A5A40] truncate max-w-[200px]" title="${item.title}">${item.title}</h3>
            <button onclick="deleteItem('${item.id}')" class="text-gray-400 hover:text-red-500 text-xs p-1 cursor-pointer">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <audio controls src="${item.url}" class="w-full h-7"></audio>
          <div class="flex gap-2 pt-1">
            <a href="${item.url}" download="${item.title}.mp3" class="flex-1 py-1 text-center bg-[#5A5A40] hover:bg-[#4a4a35] text-white text-[11px] font-bold rounded-lg transition-colors">
              <i class="fa-solid fa-download"></i> MP3 다운로드
            </a>
          </div>
        `;
        resultsList.appendChild(card);
      });
    }

    window.deleteItem = (id) => {
      const idx = audioResults.findIndex(r => r.id === id);
      if (idx !== -1) {
        URL.revokeObjectURL(audioResults[idx].url);
        audioResults.splice(idx, 1);
        renderResults();
      }
    };

    clearAllBtn.addEventListener('click', () => {
      audioResults.forEach(r => URL.revokeObjectURL(r.url));
      audioResults = [];
      renderResults();
    });

    zipDownloadBtn.addEventListener('click', async () => {
      if (audioResults.length === 0) return;
      zipDownloadBtn.disabled = true;
      zipDownloadBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 압축 중';
      try {
        const zip = new JSZip();
        for (const item of audioResults) {
          zip.file(`${item.title}.mp3`, item.blob);
        }
        const content = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `ttsservice_audio_${Date.now()}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        alert('ZIP 압축 실패: ' + e.message);
      } finally {
        zipDownloadBtn.disabled = false;
        zipDownloadBtn.innerHTML = '<i class="fa-solid fa-download"></i> ZIP';
      }
    });

    convertBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      const voice = voiceSelect.value;
      const mode = modeSelect.value;

      if (!text) {
        alert('변환할 텍스트를 입력해 주세요.');
        return;
      }

      convertBtn.disabled = true;
      statusMsg.textContent = '처리 중...';
      progressBar.classList.remove('hidden');
      progressFill.style.width = '10%';

      try {
        if (mode === 'single' || mode === 'instant') {
          btnText.textContent = '음성 생성 중...';
          const blob = await synthesizeText(text, voice);
          const item = addAudioItem(text.slice(0, 15) || 'Audio', blob, text);
          if (mode === 'instant') {
            new Audio(item.url).play();
          }
          progressFill.style.width = '100%';
          statusMsg.textContent = '완료되었습니다!';
        } else {
          // Batch Mode
          const items = parseVerses(text);
          if (items.length === 0) throw new Error('처리할 구절이 없습니다.');

          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            const pct = Math.round(((i + 1) / items.length) * 100);
            progressFill.style.width = `${pct}%`;
            btnText.textContent = `생성 중 (${i + 1}/${items.length})`;
            statusMsg.textContent = `${it.title} 변환 중...`;

            try {
              const blob = await synthesizeText(it.text, voice);
              addAudioItem(it.title, blob, it.text);
            } catch (err) {
              console.error(`Failed ${it.title}:`, err);
            }
            if (i < items.length - 1) await new Promise(r => setTimeout(r, 200));
          }
          statusMsg.textContent = `전체 ${items.length}개 구절 변환 완료!`;
        }
      } catch (err) {
        alert('오류 발생: ' + err.message);
        statusMsg.textContent = '오류: ' + err.message;
      } finally {
        convertBtn.disabled = false;
        btnText.textContent = '음성 변환 시작';
        setTimeout(() => progressBar.classList.add('hidden'), 2000);
      }
    });
  </script>
</body>
</html>
